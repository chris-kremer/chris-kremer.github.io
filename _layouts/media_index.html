<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A personal library of books on economics, human nature, and imagined worlds, with reading notes by Chris Kremer.">
  <title>The library · Chris Kremer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/library.css" | relative_url }}">
  <script src="{{ "/assets/js/library.js" | relative_url }}" defer></script>
</head>
<body data-books-url="{{ "/assets/data/library.json" | relative_url }}">
  <header class="site-header"><a href="{{ "/" | relative_url }}" class="wordmark">Chris Kremer<span> / </span><span class="section-name">Library</span></a><a href="{{ "/media/archive/" | relative_url }}" class="text-link">Full media archive <span aria-hidden="true">↗</span></a></header>
  <main>
    <section class="intro">
      <h1>The library<span>.</span></h1>
    </section>
    <noscript><p>Enable JavaScript for the interactive bookshelf, or <a href="{{ "/media/archive/" | relative_url }}">browse the full media archive</a>.</p><style>.library{display:none}</style></noscript>
    <section class="library" aria-label="Book collection">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter books">
          <button data-filter="all" aria-pressed="true">All books <span id="total-count"></span></button>
          <button data-filter="featured" aria-pressed="false">Featured</button>
          <button data-filter="reading" aria-pressed="false">Reading</button>
          <button data-filter="read" aria-pressed="false">Read</button>
          <button data-filter="unread" aria-pressed="false">To read</button>
        </div>
        <div class="tools"><label class="search"><span aria-hidden="true">⌕</span><input type="search" placeholder="Find a book or author" aria-label="Search books"></label><div class="view-switch" role="group" aria-label="Library view"><button data-view="shelf" aria-pressed="true" aria-label="Shelf view" title="Shelf view">▥</button><button data-view="grid" aria-pressed="false" aria-label="Grid view" title="Grid view">▦</button></div></div>
      </div>
      <div id="shelf-view" class="shelf-view">
        <div class="shelf-top"><span id="shelf-label">THE WHOLE SHELF</span><span class="browse-hint">DRAG TO EXPLORE <span aria-hidden="true">↔</span></span></div>
        <div id="stage" class="stage" aria-label="Interactive bookshelf. Select a book, use arrow keys, or swipe to browse." tabindex="0"><div id="book-track" class="book-track"></div></div>
        <div class="selection"><button class="arrow" id="previous" aria-label="Previous book">←</button><div id="book-info" class="book-info" aria-live="polite"></div><button class="arrow" id="next" aria-label="Next book">→</button></div>
        <div class="shelf-bottom"><span id="position"></span><span>SELECT A COVER TO TAKE A CLOSER LOOK</span><button id="random">A little serendipity <span aria-hidden="true">↗</span></button></div>
      </div>
      <div id="grid-view" class="grid-view" hidden><div class="grid-heading"><span id="grid-count"></span><span>SELECT A BOOK TO EXPLORE</span></div><div id="book-grid" class="book-grid"></div><button id="load-more" class="load-more">Show more books</button></div>
      <div id="empty" class="empty" hidden><h2>No books on this shelf.</h2><p>Try another title, author, or reading status.</p><button id="reset">Reset filters</button></div>
    </section>
    <footer><span class="concept"><a href="{{ "/media/archive/" | relative_url }}">ALL MEDIA & REVIEWS ↗</a></span></footer>
  </main>
</body>
</html>
